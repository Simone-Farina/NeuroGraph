# NeuroGraph Bloom Evaluator Golden Cases
# Phase 24 Plan 01 — 6 hand-curated Bloom classification golden cases
#
# Case Distribution:
#   Below Threshold (2): cases 1-2 — Remember/Understand, must score below Analyze
#   At Threshold (2):    cases 3-4 — Analyze, must score Analyze or higher with confidence >= 0.75
#   Above Threshold (2): cases 5-6 — Evaluate/Create, must score Evaluate or Create with confidence >= 0.80

# ──────────────────────────────────────────────────────────────────────────────
# Below Threshold — Remember / Understand
# Must classify as Remember or Understand. FAIL if Analyze, Evaluate, or Create.
# ──────────────────────────────────────────────────────────────────────────────

- description: "factual-recall — pure recall discourse scores Remember or Understand"
  vars:
    messages:
      - role: user
        content: "What is photosynthesis?"
      - role: assistant
        content: "Photosynthesis is the process by which plants use sunlight, water, and carbon dioxide to produce glucose and oxygen. What do you already know about how this process works inside a plant cell?"
      - role: user
        content: "It converts sunlight into energy that plants can use."
      - role: assistant
        content: "Good — you have the core idea. What part of the plant cell do you think is responsible for capturing that sunlight? Have you heard of chlorophyll?"
      - role: user
        content: "Plants use chlorophyll to absorb light."
  assert:
    - type: javascript
      value: |
        // Below-threshold case: user messages are pure factual recall and paraphrase.
        // Must classify as Remember or Understand — FAIL if Analyze, Evaluate, or Create.
        const result = JSON.parse(output);
        const forbiddenLevels = ['Analyze', 'Evaluate', 'Create'];
        const allowedLevels = ['Remember', 'Understand', 'Apply'];
        if (forbiddenLevels.includes(result.bloom_level)) {
          return {
            pass: false,
            score: 0,
            reason: `Over-classified: got "${result.bloom_level}" but factual recall should be Remember/Understand. Reasoning: ${result.reasoning}`,
          };
        }
        if (typeof result.reasoning !== 'string' || result.reasoning.trim().length === 0) {
          return { pass: false, score: 0, reason: 'reasoning field is missing or empty — chain-of-thought enforcement failed' };
        }
        if (typeof result.confidence !== 'number') {
          return { pass: false, score: 0, reason: 'confidence field is not a number' };
        }
        if (result.confidence < 0.5) {
          return { pass: false, score: 0.5, reason: `Confidence too low: ${result.confidence} — evaluator is uncertain about a clear recall case` };
        }
        return {
          pass: true,
          score: 1,
          reason: `Correctly classified as "${result.bloom_level}" (confidence: ${result.confidence.toFixed(2)})`,
        };


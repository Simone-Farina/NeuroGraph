# ──────────────────────────────────────────────────────────────────────────────
# At Threshold — Analyze
# Must classify as Analyze or higher with confidence >= 0.75.
# FAIL if Remember or Understand.
# ──────────────────────────────────────────────────────────────────────────────

- description: "tradeoff-analysis — explicit tradeoff comparison scores Analyze or higher"
  vars:
    messages:
      - role: user
        content: "I'm deciding between SQL and NoSQL for my project."
      - role: assistant
        content: "Good question to think through carefully. What are the main characteristics of your data — are the relationships between entities complex, or mostly flat records?"
      - role: user
        content: "SQL vs NoSQL really depends on the access patterns — you need to know how your data is queried before choosing."
      - role: assistant
        content: "Exactly. You're identifying a key design principle. What specific access patterns push you toward one or the other?"
      - role: user
        content: "Normalization reduces data redundancy but increases join complexity, and that tradeoff shifts when you have read-heavy workloads that need low latency."
  assert:
    - type: javascript
      value: |
        // At-threshold case: user compares tradeoffs explicitly.
        // Must classify as Analyze, Evaluate, or Create. FAIL if Remember or Understand.
        // Confidence must be >= 0.75 — clear Analyze signals present.
        const result = JSON.parse(output);
        const forbiddenLevels = ['Remember', 'Understand', 'Apply'];
        const requiredLevels = ['Analyze', 'Evaluate', 'Create'];
        if (forbiddenLevels.includes(result.bloom_level)) {
          return {
            pass: false,
            score: 0,
            reason: `Under-classified: got "${result.bloom_level}" but explicit tradeoff analysis should be Analyze+. Reasoning: ${result.reasoning}`,
          };
        }
        if (typeof result.reasoning !== 'string' || result.reasoning.trim().length === 0) {
          return { pass: false, score: 0, reason: 'reasoning field is missing or empty — chain-of-thought enforcement failed' };
        }
        if (typeof result.confidence !== 'number') {
          return { pass: false, score: 0, reason: 'confidence field is not a number' };
        }
        if (result.confidence < 0.75) {
          return {
            pass: false,
            score: 0.5,
            reason: `Confidence too low: ${result.confidence.toFixed(2)} (need >= 0.75) for clear tradeoff analysis case`,
          };
        }
        return {
          pass: true,
          score: 1,
          reason: `Correctly classified as "${result.bloom_level}" with confidence ${result.confidence.toFixed(2)}`,
        };


# ──────────────────────────────────────────────────────────────────────────────
# Above Threshold — Evaluate / Create
# Must classify as Evaluate or Create with confidence >= 0.80.
# FAIL if Remember, Understand, Apply, or Analyze.
# ──────────────────────────────────────────────────────────────────────────────

- description: "critical-evaluation — argued position with evidence scores Evaluate or Create"
  vars:
    messages:
      - role: user
        content: "I'm thinking through microservices vs monolithic architecture."
      - role: assistant
        content: "A classic tension. What's your current context — team size, deployment frequency, and how tightly coupled is the domain?"
      - role: user
        content: "Microservices solve team autonomy but introduce distributed system complexity — you trade one class of problems for another."
      - role: assistant
        content: "That's the core tradeoff. When does the complexity cost outweigh the autonomy benefit? What factors would tip you one way or the other?"
      - role: user
        content: "I'd argue that for a solo developer, a modular monolith is strictly better because the coordination cost of distributed services exceeds the deployment flexibility benefit — you gain nothing from the network boundary when there's no team boundary to enforce."
  assert:
    - type: javascript
      value: |
        // Above-threshold case: user argues a definitive position with explicit evidence.
        // Must classify as Evaluate or Create. FAIL if anything lower.
        // Confidence must be >= 0.80 — unambiguous evaluative stance.
        const result = JSON.parse(output);
        const requiredLevels = ['Evaluate', 'Create'];
        const forbiddenLevels = ['Remember', 'Understand', 'Apply', 'Analyze'];
        if (forbiddenLevels.includes(result.bloom_level)) {
          return {
            pass: false,
            score: 0,
            reason: `Under-classified: got "${result.bloom_level}" but an argued position with explicit evidence should be Evaluate or Create. Reasoning: ${result.reasoning}`,
          };
        }
        if (typeof result.reasoning !== 'string' || result.reasoning.trim().length === 0) {
          return { pass: false, score: 0, reason: 'reasoning field is missing or empty — chain-of-thought enforcement failed' };
        }
        if (typeof result.confidence !== 'number') {
          return { pass: false, score: 0, reason: 'confidence field is not a number' };
        }
        if (result.confidence < 0.8) {
          return {
            pass: false,
            score: 0.5,
            reason: `Confidence too low: ${result.confidence.toFixed(2)} (need >= 0.80) for clear evaluative stance case`,
          };
        }
        return {
          pass: true,
          score: 1,
          reason: `Correctly classified as "${result.bloom_level}" with confidence ${result.confidence.toFixed(2)}`,
        };


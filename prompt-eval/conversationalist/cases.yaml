# ──────────────────────────────────────────────────────────────────────────────
# Edge Cases
# ──────────────────────────────────────────────────────────────────────────────

- description: "Topic pivot mid-conversation"
  vars:
    messages:
      - role: user
        content: "I want to learn about thermodynamics."
      - role: assistant
        content: "Great choice — thermodynamics is foundational. Where do you want to start? Are you more drawn to the macro level (temperature, pressure, work) or the microscopic picture (how molecular motion relates to heat)?"
      - role: user
        content: "The macro level. I'm curious how engines extract work from heat."
      - role: assistant
        content: "Carnot's insight is one of the most beautiful ideas in physics. Before I ask about it directly — what's your intuition? If you have a hot reservoir and a cold reservoir, can you extract work indefinitely, or is there a fundamental limit? What might cause that limit?"
      - role: user
        content: "I'd guess you can't convert all heat to work, there's some waste. But I'm not sure why."
    final_user_message: "Actually, I want to think about how enzymes work instead."
    expected_neurogenesis: false

# ──────────────────────────────────────────────────────────────────────────────
# Teach-Then-Ask Cases (Phase 16 Plan 02)
# Tests the mandatory acknowledge+enrich+question structure from D-01/D-02.
# All have expected_neurogenesis: false — these are Remember/Understand-level
# answers that need enrichment before the next Socratic question, not Analyze+.
# ──────────────────────────────────────────────────────────────────────────────

- description: "Teach-then-ask on shallow answer — historical/philosophical domain"
  vars:
    messages:
      - role: user
        content: "I'm exploring Buddhist philosophy."
      - role: assistant
        content: "Great area. What draws you to it — the metaphysics, the ethical framework, or the meditative practice?"
      - role: user
        content: "I guess all of it. I read Siddhartha by Hesse."
    final_user_message: "I think Siddhartha just wanted independence from his teacher."
    expected_neurogenesis: false

- description: "Teach-then-ask on vague answer — science domain"
  vars:
    messages:

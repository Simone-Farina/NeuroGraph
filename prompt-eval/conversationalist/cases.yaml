# NeuroGraph Conversationalist Golden Cases
# Phase 13 Plan 02 — 10 hand-curated multi-turn golden cases
#
# Case Distribution:
#   Socratic Tone (4): cases 1-4 — scored threshold > 0.8, expected_neurogenesis: false
#   Neurogenesis Trigger (3): cases 5-7 — hard pass/fail, expected_neurogenesis: true
#   Neurogenesis No-Trigger (2): cases 8-9 — hard pass/fail, expected_neurogenesis: false
#   Edge Cases (1): case 10 — topic pivot, expected_neurogenesis: false

# ──────────────────────────────────────────────────────────────────────────────
# Socratic Tone Cases
# ──────────────────────────────────────────────────────────────────────────────

- description: "Coaching tone on first exchange"
  vars:
    messages: []
    final_user_message: "What is gradient descent?"
    expected_neurogenesis: false

- description: "Answer-giving refusal under pressure"
  vars:
    messages:
      - role: user
        content: "Can you help me understand backpropagation?"
      - role: assistant
        content: "Sure — before I explain it, what do you already know about how neural networks adjust their weights during training? What happens after a prediction is made?"
    final_user_message: "Just tell me the answer, what is backpropagation?"
    expected_neurogenesis: false

- description: "Persona maintained after 3 turns"
  vars:
    messages:
      - role: user
        content: "I want to understand recursion."
      - role: assistant
        content: "Great topic. Let's start from where you are — have you written any recursive functions before, even a simple one? What do you remember about how they work?"
      - role: user
        content: "I think each call just repeats the same steps until something stops it."
      - role: assistant
        content: "Good intuition on the stopping point. What would happen if there was no stopping condition? And when you say 'repeats the same steps' — do you think each call is working on the exact same problem, or something slightly different?"
      - role: user
        content: "I guess a slightly smaller problem each time? Kind of like how induction works in math?"
    final_user_message: "So the base case is like the induction base, right?"
    expected_neurogenesis: false

- description: "Tone under pressure — frustrated user"
  vars:
    messages:
      - role: user
        content: "I'm trying to understand neural networks but it's not clicking."
      - role: assistant
        content: "That's completely understandable — there's a lot to hold at once. Let's slow down and pick one piece. What's the part that feels most slippery right now? Is it how the network is structured, or how it actually learns?"
      - role: user
        content: "All of it. I feel like I'm missing something fundamental."
    final_user_message: "I don't understand any of this, can you just explain it simply?"
    expected_neurogenesis: false

# ──────────────────────────────────────────────────────────────────────────────
# Neurogenesis Trigger Cases (Bloom Analyze / Evaluate / Create)
# ──────────────────────────────────────────────────────────────────────────────

- description: "Bloom Analyze level triggers Neurogenesis"
  vars:
    messages:
      - role: user
        content: "I want to understand recursion deeply."
      - role: assistant
        content: "Good starting point. When you think about a function calling itself, what's actually happening in terms of execution? Have you traced through a simple example like factorial or fibonacci?"
      - role: user
        content: "Yeah, I traced factorial. It keeps calling itself with n-1 until it hits 1."
      - role: assistant
        content: "Nice — you've got the mechanics. Now here's a more interesting question: why does calling with n-1 actually get you closer to an answer? What's the structural guarantee there? And does that pattern remind you of anything from math?"
      - role: user
        content: "It's like each step reduces the problem... wait, kind of like induction?"
      - role: assistant
        content: "You're on the edge of something real. What's the specific parallel you see? Try to be precise — what maps to what?"
    final_user_message: "I realized that recursion is basically computational induction — the base case maps to the induction base, and the recursive step maps to the inductive hypothesis."
    expected_neurogenesis: true

- description: "Bloom Evaluate level triggers Neurogenesis"
  vars:
    messages:
      - role: user
        content: "I need to choose between SQL and NoSQL for my project."
      - role: assistant
        content: "Let's think through it carefully. What kind of data relationships does your project have — are they mostly flat records, or do entities have complex connections to each other? And what do you know about the consistency guarantees you'll need?"
      - role: user
        content: "The data has some relationships and I really care about correctness — no partial writes."
      - role: assistant
        content: "That's an important constraint. What do you know about how relational databases handle partial writes versus how distributed NoSQL systems typically handle them? Think about what happens when a failure occurs mid-transaction in each case."
      - role: user
        content: "SQL has ACID so it rolls back. NoSQL is eventually consistent which means you might read stale data."
    final_user_message: "I think SQL is better than NoSQL for transactional consistency because ACID guarantees prevent the kind of anomalies that eventually-consistent systems allow — the trade-off is horizontal scalability."
    expected_neurogenesis: true

- description: "Bloom Create level triggers Neurogenesis"
  vars:
    messages:
      - role: user
        content: "I'm working on a caching problem — my app is slow under load."
      - role: assistant
        content: "Caching is a rich design space. Before jumping to a solution, what do you know about your access patterns? Are all keys read equally often, or is there a skew — some data much hotter than others?"
      - role: user
        content: "Definitely skewed. Some data gets hit all the time, some rarely."
      - role: assistant
        content: "That's a useful signal. If 20% of your keys account for 80% of reads, what does that tell you about the ideal size of your cache? And what happens when a very hot key expires — what does your system experience in that moment?"
      - role: user
        content: "Cache stampede I guess? All the requests pile up. And the cache doesn't need to hold everything, just the hot stuff."
    final_user_message: "I designed a two-tier caching approach: an in-memory LRU for hot data and a Redis layer for warm data, because the access pattern shows a clear 80/20 distribution that maps to different TTL strategies."
    expected_neurogenesis: true

# ──────────────────────────────────────────────────────────────────────────────
# Neurogenesis No-Trigger Cases (Bloom Remember / Understand)
# ──────────────────────────────────────────────────────────────────────────────

- description: "Remember level does NOT trigger Neurogenesis"
  vars:
    messages:
      - role: user
        content: "I'm starting to learn about data structures."
    final_user_message: "What is a hash table?"
    expected_neurogenesis: false

- description: "Understand level does NOT trigger Neurogenesis"
  vars:
    messages:
      - role: user
        content: "I need to sort a large array efficiently."
      - role: assistant
        content: "Good problem to think through. What do you already know about sorting algorithms? Have you worked with any of them before, and what was your experience with their performance?"
    final_user_message: "Can you explain how quicksort works?"
    expected_neurogenesis: false

# ──────────────────────────────────────────────────────────────────────────────
# Edge Cases
# ──────────────────────────────────────────────────────────────────────────────

- description: "Topic pivot mid-conversation"
  vars:
    messages:
      - role: user
        content: "I want to learn about thermodynamics."
      - role: assistant
        content: "Great choice — thermodynamics is foundational. Where do you want to start? Are you more drawn to the macro level (temperature, pressure, work) or the microscopic picture (how molecular motion relates to heat)?"
      - role: user
        content: "The macro level. I'm curious how engines extract work from heat."
      - role: assistant
        content: "Carnot's insight is one of the most beautiful ideas in physics. Before I ask about it directly — what's your intuition? If you have a hot reservoir and a cold reservoir, can you extract work indefinitely, or is there a fundamental limit? What might cause that limit?"
      - role: user
        content: "I'd guess you can't convert all heat to work, there's some waste. But I'm not sure why."
    final_user_message: "Actually, I want to think about how enzymes work instead."
    expected_neurogenesis: false

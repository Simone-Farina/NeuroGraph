# NeuroGraph Conversationalist Golden Cases
# Phase 23 Plan 01 — Pure-text Socratic tutor contract
# Rebuilt from scratch: 4 new golden cases with no-jargon, natural-flow,
# depth-challenge, and mistake-handling assertions.
#
# Case Distribution:
#   no-jargon (1): assert FAIL if NeuroGraph platform terms appear
#   natural-flow (1): assert FAIL if unsolicited bullet points appear
#   depth-challenge (1): assert PASS only if response contains a question and pushes deeper
#   mistake-handling (1): assert FAIL if direct correction leads the response

# ──────────────────────────────────────────────────────────────────────────────
# Case 1: No jargon in response
# ──────────────────────────────────────────────────────────────────────────────

- description: "no-jargon — response must not contain NeuroGraph platform terms"
  vars:
    messages:
      - role: user
        content: "I want to understand recursion better."
      - role: assistant
        content: "Good topic to dig into. Have you written any recursive functions before, or is this your first encounter with the idea?"
    final_user_message: "I think each recursive call just reduces the problem."
  assert:
    - type: javascript
      value: |
        // Hard jargon ban: response must contain NONE of these NeuroGraph platform terms.
        // These belong to the UI layer, not the conversational voice.
        const result = JSON.parse(output);
        const text = result.response;
        const banned = [
          /\bNeuron\b/i,
          /\bCrystallize\b/i,
          /\bBloom\b/i,
          /\bTaxonomy\b/i,
          /\bInsight\b/i,
          /\bKnowledge Graph\b/i,
          /\bNeurogenesis\b/i,
        ];
        const hit = banned.find((rx) => rx.test(text));
        if (hit) {
          return { pass: false, score: 0, reason: `Response contains banned jargon matching: ${hit}` };
        }
        return { pass: true, score: 1, reason: 'No banned platform jargon found in response' };

# ──────────────────────────────────────────────────────────────────────────────
# Case 2: Natural flow — no unsolicited bullet points
# ──────────────────────────────────────────────────────────────────────────────

- description: "natural-flow — response must not contain unsolicited bullet points or numbered lists"
  vars:
    messages:
      - role: user
        content: "I'm trying to decide how to structure my database."
      - role: assistant
        content: "What kind of data are you working with — are the relationships between things mostly flat, or do entities connect to each other in complex ways?"
      - role: user
        content: "There are some relationships, like users having many orders."
    final_user_message: "I'm not sure when to normalize versus denormalize."
  assert:
    - type: javascript
      value: |
        // Natural conversation: no unsolicited bullet points or numbered lists.
        // Regex matches lines starting with *, -, or a number followed by . or )
        const result = JSON.parse(output);
        const lines = result.response.split('\n');
        const bulletLine = lines.find((line) => /^\s*[\*\-\d]+[\.\)]\s+/.test(line));
        if (bulletLine) {
          return {
            pass: false,
            score: 0,
            reason: `Response contains unsolicited list formatting: "${bulletLine.trim()}"`,
          };
        }
        return { pass: true, score: 1, reason: 'Response flows as natural prose — no unsolicited lists' };

# ──────────────────────────────────────────────────────────────────────────────
# Case 3: Depth challenge — pushes user to think deeper
# ──────────────────────────────────────────────────────────────────────────────

- description: "depth-challenge — response must ask a follow-up question and be substantive"
  vars:
    messages:
      - role: user
        content: "I've been reading about machine learning."
      - role: assistant
        content: "What part draws you in most — how the models are trained, or what they can actually do?"
      - role: user
        content: "How they learn, I guess."
      - role: assistant
        content: "Fair. When you picture a model 'learning' — what do you imagine is actually changing? Is it the structure of the program, or something else?"
      - role: user
        content: "I think it's changing some numbers inside?"
    final_user_message: "Neural networks just learn patterns from data."
  assert:
    - type: javascript
      value: |
        // Depth challenge: the agent must push the user to think deeper.
        // Hard requirement: response must contain at least one question mark (Socratic obligation)
        // AND be substantive (> 100 chars) — not just a bare acknowledgement.
        const result = JSON.parse(output);
        const text = result.response;
        const hasQuestion = /\?/.test(text);
        if (!hasQuestion) {
          return { pass: false, score: 0, reason: 'Response contains no question — agent must push for deeper thinking' };
        }
        if (text.length <= 100) {
          return { pass: false, score: 0.3, reason: 'Response too short to constitute a meaningful depth challenge' };
        }
        return { pass: true, score: 1, reason: 'Response challenges user with a substantive follow-up question' };

# ──────────────────────────────────────────────────────────────────────────────
# Case 4: Mistake handling — no direct correction
# ──────────────────────────────────────────────────────────────────────────────

- description: "mistake-handling — agent probes reasoning instead of directly correcting the error"
  vars:
    messages:
      - role: user
        content: "I'm learning about photosynthesis."
      - role: assistant
        content: "Good starting point. What do you already know about what photosynthesis produces and what it needs to work?"
    final_user_message: "Photosynthesis produces carbon dioxide — plants breathe it out."
  assert:
    - type: javascript
      value: |
        // Mistake handling: the user stated something factually wrong.
        // Agent must NOT lead with a direct correction — it should probe the user's reasoning.
        // FAIL if response starts with "Actually" or "That's incorrect" / "That's wrong" (bare correction).
        // PASS only if response contains a question mark (probing reasoning).
        const result = JSON.parse(output);
        const text = result.response;
        const hasQuestion = /\?/.test(text);
        if (!hasQuestion) {
          return { pass: false, score: 0, reason: 'Agent did not ask a question — must probe reasoning on incorrect statement' };
        }
        const directCorrection = /^(actually|that('s| is) (incorrect|wrong|not right))/i.test(text.trim());
        if (directCorrection) {
          return { pass: false, score: 0, reason: 'Agent opened with direct correction — should ask about reasoning first' };
        }
        return { pass: true, score: 1, reason: 'Agent probed reasoning with a question without leading with direct correction' };

# Judge model pin: openai:gpt-4o-2024-08-06 — re-baseline scores if changed
description: NeuroGraph Golden Conversationalist suite — Phase 23 pure-text contract
prompts:
  - file://prompt.json
providers:
  - exec:node ../shared/neurograph-conversationalist-provider.mjs
defaultTest:
  assert:
    - type: javascript
      value: |
        // Scored Socratic tone assertion
        // Threshold >= 0.7 (lowered from 0.8 for natural, less formulaic responses)
        const result = JSON.parse(output);
        const score = result.socratic_score;
        return { pass: score >= 0.7, score, reason: `Socratic tone score: ${score.toFixed(2)}` };
tests: cases.yaml
